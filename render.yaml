services:
  # Fastify Node API Web Service
  - type: web
    name: gymify-server
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate --schema=./packages/database/prisma/schema.prisma && npm run build
    startCommand: npx prisma db push --schema=./packages/database/prisma/schema.prisma && npm start --workspace=@gymify/server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gymify-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gymify-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DIAGNOSTICS_WEBHOOK_URL
        sync: false
      - key: APP_LATEST_VERSION
        value: "0.1.0"
      - key: APP_MIN_REQUIRED_VERSION
        value: "0.1.0"
      - key: ANDROID_APK_DOWNLOAD_URL
        sync: false
      - key: APP_RELEASE_NOTES
        value: "Performance improvements, bug fixes, and new RPG content."

  # Redis instance for BullMQ background workers and timers
  - type: redis
    name: gymify-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # Managed PostgreSQL Database
  - name: gymify-postgres
    databaseName: gymify_rpg
    user: gymify
    plan: free
