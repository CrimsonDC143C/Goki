services:
  # Fastify Node API Web Service
  - type: web
    name: gymify-server
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start --workspace=@gymify/server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gymify-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gymify-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

  # Redis instance for BullMQ background workers and timers
  - type: redis
    name: gymify-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # Managed PostgreSQL Database
  - name: gymify-postgres
    databaseName: gymify_rpg
    user: gymify
    plan: starter
